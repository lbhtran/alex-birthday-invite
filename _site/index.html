<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Invite</title>
    <style>
      :root {
        --pink: #ff4fa3;
        --yellow: #ffd84d;
        --green: #3ebd65;
        --sky: #c7f0ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #2d1b1b;
        background: linear-gradient(#9ce8ff 0 50%, #67d875 50% 100%);
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(960px, 100%);
        min-height: 560px;
        border-radius: 22px;
        border: 4px solid #ffffffb8;
        background: radial-gradient(circle at 70% 15%, #fff6b9 0 15%, transparent 16%),
          linear-gradient(#bff4ff 0 48%, #82df7f 48% 100%);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .party-item {
        position: absolute;
        transition: transform 0.45s ease, filter 0.45s ease, opacity 0.45s ease;
        animation: slide-in 0.9s ease both;
      }

      .scene:hover .party-item {
        filter: saturate(1.2) brightness(1.06);
      }

      @keyframes slide-in {
        from {
          transform: translateY(30px) scale(0.9);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .banner {
        top: 1.1rem;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #ff43a5, #ff8b2e, #ffe653, #43d25a, #26c3ff, #9b5dff);
        color: #fff;
        padding: 0.9rem 1.6rem;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: clamp(0.9rem, 2.1vw, 1.35rem);
        font-weight: 900;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .scene:hover .banner {
        transform: translateX(-50%) translateY(-10px) scale(1.06);
      }

      .invite-card {
        left: 50%;
        top: 6rem;
        transform: translateX(-50%);
        width: min(450px, calc(100% - 2rem));
        text-align: center;
        padding: 1.2rem;
        border: 3px dashed #ff89bf;
        border-radius: 16px;
        background: #ffffffde;
      }

      .invite-card h1 {
        margin: 0;
        color: #ff2b8d;
      }

      .invite-card p {
        margin: 0.55rem 0 0;
        font-weight: 700;
      }

      .scene:hover .invite-card {
        transform: translateX(-50%) translateY(8px);
      }

      .grill {
        bottom: 2rem;
        left: 3.5rem;
        width: 130px;
        height: 150px;
      }

      .grill::before,
      .grill::after {
        content: "";
        position: absolute;
      }

      .grill::before {
        inset: 45px 0 45px 0;
        background: #242424;
        border-radius: 14px;
        box-shadow: inset 0 0 0 4px #474747;
      }

      .grill::after {
        left: 12px;
        right: 12px;
        top: 57px;
        height: 16px;
        background: repeating-linear-gradient(90deg, #777 0 5px, #bbb 5px 8px);
        border-radius: 8px;
      }

      .grill-legs {
        position: absolute;
        bottom: 0;
        left: 20px;
        width: 14px;
        height: 48px;
        background: #333;
        border-radius: 8px;
        box-shadow: 72px 0 0 #333;
      }

      .smoke {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ffffffb8;
        box-shadow: 20px -10px 0 #ffffff9f, 40px -20px 0 #ffffff88;
        animation: drift 3.4s ease-in-out infinite;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.9;
        }
        50% {
          transform: translateY(-14px);
          opacity: 0.55;
        }
      }

      .scene:hover .grill {
        transform: translateX(-14px) rotate(-3deg);
      }

      .cake {
        bottom: 2.2rem;
        right: 4.3rem;
        width: 130px;
        height: 120px;
      }

      .cake::before,
      .cake::after {
        content: "";
        position: absolute;
      }

      .cake::before {
        left: 0;
        right: 0;
        bottom: 0;
        height: 66px;
        border-radius: 14px;
        background: linear-gradient(#ff91c6 0 33%, #fff2a8 33% 66%, #ff91c6 66% 100%);
        box-shadow: inset 0 0 0 3px #ffffff85;
      }

      .cake::after {
        left: 18px;
        right: 18px;
        bottom: 62px;
        height: 18px;
        border-radius: 999px;
        background: #fff;
      }

      .candles {
        position: absolute;
        top: 15px;
        left: 18px;
        width: 10px;
        height: 36px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 28px 4px 0 #fff, 56px 0 0 #fff, 84px 5px 0 #fff;
      }

      .candles::before {
        content: "";
        position: absolute;
        left: -1px;
        top: -10px;
        width: 12px;
        height: 12px;
        border-radius: 60% 40% 55% 45%;
        background: #ffd65d;
        box-shadow: 28px 4px 0 #ffd65d, 56px 0 0 #ffd65d, 84px 5px 0 #ffd65d;
        animation: flicker 1.2s infinite alternate;
      }

      @keyframes flicker {
        from {
          transform: scale(1) rotate(-5deg);
        }
        to {
          transform: scale(1.12) rotate(5deg);
        }
      }

      .scene:hover .cake {
        transform: translateX(16px) rotate(4deg);
      }

      .plants {
        position: absolute;
        bottom: 1rem;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-evenly;
        pointer-events: none;
      }

      .plant {
        width: 54px;
        height: 100px;
        background: linear-gradient(#42bf5b, #1f8d3d);
        clip-path: polygon(50% 0, 64% 45%, 100% 12%, 77% 60%, 94% 100%, 50% 72%, 6% 100%, 23% 60%, 0 12%, 36% 45%);
        opacity: 0.95;
      }

      .scene:hover .plant:nth-child(odd) {
        transform: translateY(-9px) rotate(-7deg);
      }

      .scene:hover .plant:nth-child(even) {
        transform: translateY(-9px) rotate(7deg);
      }

      .confetti {
        inset: 0;
        pointer-events: none;
      }

      .piece {
        position: absolute;
        width: 10px;
        height: 16px;
        border-radius: 3px;
        animation: fall linear infinite;
      }

      .piece:nth-child(odd) {
        background: var(--pink);
      }

      .piece:nth-child(even) {
        background: var(--yellow);
      }

      .piece:nth-child(3n) {
        background: #39d06a;
      }

      .piece:nth-child(4n) {
        background: #2bc8ff;
      }

      @keyframes fall {
        from {
          transform: translateY(-45px) rotate(0deg);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        to {
          transform: translateY(560px) rotate(360deg);
          opacity: 0.85;
        }
      }

      .scene:hover .piece {
        animation-duration: 2s !important;
      }

      @media (max-width: 760px) {
        .scene {
          min-height: 620px;
        }

        .grill {
          left: 1rem;
        }

        .cake {
          right: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="party-item banner">Alex's Garden BBQ Birthday Bash</div>

      <section class="party-item invite-card">
        <h1>You're Invited!</h1>
        <p>Join me for a super fun birthday in the garden.</p>
        <p><strong>Date:</strong> May 25th, 1991</p>
      </section>

      <div class="party-item grill" aria-hidden="true">
        <div class="smoke"></div>
        <div class="grill-legs"></div>
      </div>

      <div class="party-item cake" aria-hidden="true">
        <div class="candles"></div>
      </div>

      <div class="plants">
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
        <div class="party-item plant"></div>
      </div>

      <div class="party-item confetti" aria-hidden="true">
        <span class="piece" style="left: 4%; animation-duration: 3.6s; animation-delay: 0.5s"></span>
        <span class="piece" style="left: 12%; animation-duration: 3.2s; animation-delay: 0.9s"></span>
        <span class="piece" style="left: 19%; animation-duration: 4.1s; animation-delay: 0.2s"></span>
        <span class="piece" style="left: 27%; animation-duration: 3.5s; animation-delay: 0.8s"></span>
        <span class="piece" style="left: 36%; animation-duration: 4.3s; animation-delay: 0.3s"></span>
        <span class="piece" style="left: 45%; animation-duration: 3.1s; animation-delay: 1s"></span>
        <span class="piece" style="left: 54%; animation-duration: 4s; animation-delay: 0.1s"></span>
        <span class="piece" style="left: 62%; animation-duration: 3.4s; animation-delay: 1.2s"></span>
        <span class="piece" style="left: 70%; animation-duration: 4.2s; animation-delay: 0.7s"></span>
        <span class="piece" style="left: 78%; animation-duration: 3.3s; animation-delay: 0.4s"></span>
        <span class="piece" style="left: 86%; animation-duration: 4.4s; animation-delay: 0.6s"></span>
        <span class="piece" style="left: 94%; animation-duration: 3.7s; animation-delay: 1.1s"></span>
      </div>
    </main>
  </body>
</html>
