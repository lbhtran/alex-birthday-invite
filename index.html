<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Invite</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #fff8f0;
        color: #2d1b1b;
      }

      main {
        text-align: center;
        padding: 2rem;
        border: 2px solid #f0c4a8;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're Invited!</h1>
      <p>Please join me for my birthday party.</p>
      <p><strong>Date:</strong> May 25th, 1991</p>
    </main>
  </body>
</html>
